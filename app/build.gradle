plugins { id 'com.android.application' }

android {
    namespace 'com.indocyber.beaconscale'
    compileSdk 34

    defaultConfig {
        applicationId "com.indocyber.beaconscale"
        minSdk 21          // Android 5.0+ (hampir semua HP)
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
