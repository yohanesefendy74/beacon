name: Compile ESP32 sketch
on:
  push:
    paths: ['esp32/**', '.github/workflows/build-esp32.yml']
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [INPUT_DEMO, INPUT_HX711, INPUT_RS232]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core + HX711
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "HX711"
      - name: Compile (${{ matrix.mode }})
        run: >
          arduino-cli compile --fqbn esp32:esp32:esp32
          --build-property "compiler.cpp.extra_flags=-DINPUT_MODE=${{ matrix.mode }}"
          --output-dir out
          esp32/ESP32_iBeacon_Scale
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-${{ matrix.mode }}
          path: out/*.bin
